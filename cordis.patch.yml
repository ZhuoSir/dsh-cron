# The dsh-cron bundle patch: one insert row carrying the whole plugin config.
# Users override this row (by id) in their profile cordis.patch.yml; a patch
# replaces the row's whole config, so restate every key you keep.
- insert:
    - id: dsh-cron
      name: dsh-cron
      config:
        # Where dynamically added tasks and run stamps are persisted.
        # Empty means $DSH_HOME/cron-tasks.json.
        storagePath: ''
        # Where execution history (one JSON record per line) is persisted.
        # Empty means $DSH_HOME/cron-history.jsonl.
        historyPath: ''
        # Scheduler wake interval in seconds. Lower bounds how late a due
        # task can fire; 15s is a good default.
        tickSeconds: 15
        # IANA time zone used by daily/cron tasks that omit timeZone.
        defaultTimeZone: Asia/Shanghai
        # Resume the exact bound Session when it is cold; never fall back.
        coldWake: true
        # Native OS notification when a run finishes (macOS osascript / Linux
        # notify-send). Windows is a quiet no-op. Fires from the host process.
        systemNotify: true
        # Play the OS alert sound with the native notification.
        systemNotifySound: true
        # Static tasks declared in config. Every entry requires an explicit
        # sessionId owner or plugin startup fails. Dynamic tasks created through
        # cron_add bind to ToolRunContext.exec.agent's live root Session.
        # Each task: { id?, prompt, at? | every? | daily? | cron?, sessionId?, enabled? }
        #   at:    ISO 8601 instant, fires once        ("2026-08-23T09:00:00+08:00")
        #   every: fixed interval in seconds, min 10   (3600)
        #   daily: local wall-clock "HH:MM", fires daily ("09:30")
        #   cron:  5-field expression, local time      ("0 9 * * 1" = Mon 09:00)
        #   sessionId: bind delivery to one session instead of the active one
        tasks: []
